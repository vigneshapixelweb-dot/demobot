<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket Detail</title>
  <style>
    :root {
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.16), transparent 32%),
        linear-gradient(180deg, #edf4ff 0%, #f8fbff 100%);
      color: #1f2937;
      min-height: 100vh;
      padding: clamp(16px, 2.5vw, 28px);
      overflow-y: auto;
    }
    .container {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header p {
      margin: 8px 0 0;
      color: #475569;
      font-size: 14px;
      max-width: 680px;
    }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(300px, 0.9fr);
      gap: 20px;
      align-items: start;
    }
    .stack {
      display: grid;
      gap: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      padding: 22px;
      backdrop-filter: blur(10px);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 24px;
      margin: 0;
    }
    h2 {
      font-size: 18px;
      margin: 0;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .meta-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .meta-item strong {
      display: block;
      color: #475569;
      margin-bottom: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-pill {
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: #fff;
      font-size: 12px;
      border-radius: 999px;
      padding: 7px 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 24px rgba(13, 148, 136, 0.18);
    }
    .status-pill.closed {
      background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%);
      box-shadow: 0 10px 24px rgba(220, 38, 38, 0.18);
    }
    .history {
      display: grid;
      gap: 14px;
    }
    .msg {
      border-radius: 14px;
      padding: 14px;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      box-shadow: 0 8px 24px rgba(148, 163, 184, 0.12);
    }
    .msg.ai {
      border-color: #dbeafe;
      background: #f8fbff;
    }
    .msg.admin {
      border-color: #fde68a;
      background: #fffbeb;
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: #475569;
      font-weight: 700;
      text-transform: uppercase;
    }
    .msg-body {
      white-space: pre-wrap;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .actions {
      display: grid;
      gap: 12px;
    }
    .sticky-card {
      position: sticky;
      top: 20px;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      resize: vertical;
      line-height: 1.5;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 11px 15px;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
    }
    .primary { background: #1d4ed8; }
    .danger { background: #b91c1c; }
    .secondary { background: #64748b; }
    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }
    .note {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    .error {
      color: #b91c1c;
      font-size: 13px;
      font-weight: 600;
    }
    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
      .sticky-card {
        position: static;
      }
    }
    @media (max-width: 640px) {
      body {
        padding: 14px;
      }
      .card {
        padding: 18px;
      }
      h1 {
        font-size: 21px;
      }
      .msg-head {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
      .btn-row {
        flex-direction: column;
      }
      button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <h1 id="ticket-title">Ticket</h1>
        <p>Review the ticket details, follow the full conversation history, and reply without losing page scroll on longer threads.</p>
      </div>
      <div id="status-pill" class="status-pill">OPEN</div>
    </div>

    <div class="content-grid">
      <div class="stack">
        <div class="card">
          <div class="header-row">
            <h2>Ticket Summary</h2>
          </div>
          <div class="meta" id="ticket-meta"></div>
        </div>

        <div class="card">
          <div class="header-row" style="margin-bottom: 14px;">
            <h2>Conversation History</h2>
          </div>
          <div id="history" class="history"></div>
        </div>
      </div>

      <div class="card sticky-card">
        <div class="header-row" style="margin-bottom: 10px;">
          <h2>Admin Actions</h2>
        </div>
        <div class="actions">
          <textarea id="admin-reply" placeholder="Type a reply for this ticket..."></textarea>
          <div class="btn-row">
            <button class="primary" id="reply-btn" onclick="sendReply()">Send Reply</button>
            <button class="danger" id="close-btn" onclick="closeTicket()">Close Ticket</button>
            <button class="secondary" onclick="reloadTicket()">Refresh</button>
          </div>
          <div class="note">Replies are appended to ticket history and visible in admin audit trail.</div>
          <div id="error" class="error"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="ticket.js"></script>
</body>
</html>
